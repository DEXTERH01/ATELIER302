server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application.name: atelier-gestion-digital
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atelier}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:10}MB
      max-request-size: ${MAX_UPLOAD_MB:10}MB
  jackson.time-zone: America/Lima
atelier:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change_me_with_at_least_32_bytes_please}
    issuer: atelier-gestion-digital
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  cookie:
    name: ATELIER_REFRESH
    secure: ${REFRESH_COOKIE_SECURE:false}
  environment: ${ATELIER_ENVIRONMENT:dev}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:change_me}
    api-key: ${CLOUDINARY_API_KEY:change_me}
    api-secret: ${CLOUDINARY_API_SECRET:change_me}
  files:
    max-upload-bytes: ${MAX_UPLOAD_BYTES:10485760}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs.path: /v3/api-docs

